<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestor Photo Submission</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }
        h2 { margin-top: 0; color: #1a365d; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 0.95rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #4a5568; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="file"] { background: #fafafa; }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        #loading { display: none; text-align: center; margin-top: 15px; color: #4a5568; font-weight: 500; }
        #success-message { display: none; text-align: center; color: #2f855a; background: #f0fff4; padding: 15px; border-radius: 6px; border: 1px solid #c6f6d5; }
        iframe { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ancestor Photo Submission</h2>
    <p class="subtitle">Share a photo and details of your ancestor for our event slideshow.</p>
    
    <!-- Hidden iframe targets response to prevent page reload -->
    <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

    <!-- REPLACE THE action URL BELOW WITH YOUR WEB APP URL -->
    <form id="submissionForm" action="https://script.google.com/macros/s/AKfycbzb3LTmrNDs-snNvwBq2X6IKOZXbFfr6Q9xctObouCubbD8hRnf5NNzWIKVq6JLuqNUFw/exec" method="POST" enctype="multipart/form-data" target="hidden_iframe">
        <div class="form-group">
            <label for="submitterName">Your Name:</label>
            <input type="text" id="submitterName" name="submitterName" required placeholder="e.g., Jane Doe">
        </div>
        
        <div class="form-group">
            <label for="ancestorName">Ancestor's Name:</label>
            <input type="text" id="ancestorName" name="ancestorName" required placeholder="e.g., John Smith">
        </div>
        
        <div class="form-group">
            <label for="relationship">Your Relationship to Ancestor:</label>
            <input type="text" id="relationship" name="relationship" required placeholder="e.g., Great-Grandfather">
        </div>
        
        <div class="form-group">
            <label for="photo">Ancestor's Photograph:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>
        
        <button type="submit" id="submitBtn">Submit Ancestor Info</button>
        <div id="loading">Uploading submission, please wait...</div>
    </form>

    <div id="success-message">
        <h3>Thank You!</h3>
        <p>Your ancestor's information and photo have been successfully submitted.</p>
        <button onclick="location.reload()" style="background-color: #4a5568; margin-top: 10px; border:none; color:white; padding:10px; border-radius:6px; cursor:pointer;">Submit Another</button>
    </div>
</div>

<script>
    const form = document.getElementById('submissionForm');
    const submitBtn = document.getElementById('submitBtn');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', function() {
        submitBtn.disabled = true;
        loadingDiv.style.display = 'block';
    });

    // Callback function called by the iframe when Google Apps Script responds
    function onUploadSuccess() {
        form.style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
    }

    function onUploadError(errMsg) {
        alert('Upload failed: ' + errMsg);
        submitBtn.disabled = false;
        loadingDiv.style.display = 'none';
    }
</script>

</body>
</html>
