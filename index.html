<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestor Photo Submission</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }
        h2 { margin-top: 0; color: #1a365d; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 0.95rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #4a5568; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="file"] { background: #fafafa; }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        #loading { display: none; text-align: center; margin-top: 15px; color: #4a5568; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ancestor Photo Submission</h2>
    <p class="subtitle">Share a photo and details of your ancestor for our event slideshow.</p>
    
    <!-- Direct Submit to Apps Script -->
    <form id="submissionForm" action="https://script.google.com/macros/s/AKfycbzb3LTmrNDs-snNvwBq2X6IKOZXbFfr6Q9xctObouCubbD8hRnf5NNzWIKVq6JLuqNUFw/exec" method="POST">
        <div class="form-group">
            <label for="submitterName">Your Name:</label>
            <input type="text" id="submitterName" name="submitterName" required placeholder="e.g., Jane Doe">
        </div>
        
        <div class="form-group">
            <label for="ancestorName">Ancestor's Name:</label>
            <input type="text" id="ancestorName" name="ancestorName" required placeholder="e.g., John Smith">
        </div>
        
        <div class="form-group">
            <label for="relationship">Your Relationship to Ancestor:</label>
            <input type="text" id="relationship" name="relationship" required placeholder="e.g., Great-Grandfather">
        </div>
        
        <div class="form-group">
            <label for="photoPicker">Ancestor's Photograph:</label>
            <input type="file" id="photoPicker" accept="image/*" required>
        </div>

        <!-- Hidden inputs store base64 image data -->
        <input type="hidden" id="fileData" name="fileData">
        <input type="hidden" id="fileName" name="fileName">
        <input type="hidden" id="mimeType" name="mimeType">
        
        <button type="submit" id="submitBtn">Submit Ancestor Info</button>
        <div id="loading">Processing and uploading image, please wait...</div>
    </form>
</div>

<script>
    const form = document.getElementById('submissionForm');
    const photoPicker = document.getElementById('photoPicker');
    const submitBtn = document.getElementById('submitBtn');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', function(e) {
        if (!document.getElementById('fileData').value) {
            e.preventDefault(); // Pause form submission until photo is compressed
            
            if (photoPicker.files.length === 0) {
                alert("Please select a photo.");
                return;
            }

            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';

            const file = photoPicker.files[0];
            const reader = new FileReader();

            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = compressedDataUrl.split(',')[1];

                    document.getElementById('fileData').value = base64Data;
                    document.getElementById('fileName').value = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
                    document.getElementById('mimeType').value = "image/jpeg";

                    // Resume native form POST now that data is populated
                    form.submit();
                };
            };
        }
    });
</script>

</body>
</html>
