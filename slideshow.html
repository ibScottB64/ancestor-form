<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestor Memory Slideshow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #0b0e14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vw;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* Responsive image container that expands to fill screen */
        .image-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0; /* Prevents overflow in flexbox */
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Fits full photo without cropping */
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        /* Overlay caption card */
        .caption-card {
            background: rgba(18, 24, 38, 0.9);
            backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            margin-top: 15px;
            max-width: 90vw;
            width: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .ancestor-name {
            font-size: clamp(1.5rem, 3.5vw, 2.8rem);
            font-weight: 700;
            color: #f0f6fc;
            line-height: 1.2;
        }

        .relationship-info {
            font-size: clamp(0.95rem, 1.8vw, 1.35rem);
            color: #8b949e;
            margin-top: 4px;
        }

        .relationship-info span {
            color: #58a6ff;
            font-weight: 600;
        }

        /* Mobile Adjustments (Phones) */
        @media (max-width: 600px) {
            .slide {
                padding: 12px;
            }
            .caption-card {
                padding: 12px 18px;
                margin-top: 10px;
                width: 100%;
            }
        }

        /* Loading / Waiting state */
        #status-screen {
            font-size: 1.2rem;
            color: #8b949e;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border-left-color: #58a6ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="slideshow-container" id="slideshowContainer">
    <div id="status-screen">
        <div class="spinner"></div>
        <p id="status-text">Loading ancestor slideshow...</p>
    </div>
</div>

<script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzb3LTmrNDs-snNvwBq2X6IKOZXbFfr6Q9xctObouCubbD8hRnf5NNzWIKVq6JLuqNUFw/exec";

    const SLIDE_DURATION = 6000; // 6 seconds per photo
    const REFRESH_INTERVAL = 30000; // Check Google Sheet every 30 seconds

    let slidesData = [];
    let currentIndex = 0;
    let timer = null;

    async function fetchSubmissions() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();

            const validData = data.filter(item => item.imageUrl && item.imageUrl.trim().length > 0);

            if (validData.length === 0) {
                if (slidesData.length === 0) {
                    document.getElementById('status-text').innerText = "No ancestor photos submitted yet.";
                }
                return;
            }

            const isFirstLoad = (slidesData.length === 0);
            slidesData = validData;

            if (isFirstLoad) {
                initSlideshow();
            }
        } catch (error) {
            console.error("Error fetching slideshow data:", error);
            if (slidesData.length === 0) {
                document.getElementById('status-text').innerText = "Unable to load slideshow data.";
            }
        }
    }

    function initSlideshow() {
        const container = document.getElementById('slideshowContainer');
        container.innerHTML = '';

        renderSlide(currentIndex);
        startTimer();
    }

    function renderSlide(index) {
        const container = document.getElementById('slideshowContainer');
        const item = slidesData[index];

        const slideDiv = document.createElement('div');
        slideDiv.className = 'slide active';

        slideDiv.innerHTML = `
            <div class="image-wrapper">
                <img src="${item.imageUrl}" alt="${item.ancestorName}">
            </div>
            <div class="caption-card">
                <div class="ancestor-name">${item.ancestorName}</div>
                <div class="relationship-info">
                    ${item.relationship} of <span>${item.submitterName}</span>
                </div>
            </div>
        `;

        const oldSlide = container.querySelector('.slide.active');
        container.appendChild(slideDiv);

        if (oldSlide) {
            setTimeout(() => {
                oldSlide.style.opacity = '0';
                setTimeout(() => oldSlide.remove(), 1200);
            }, 50);
        }
    }

    function nextSlide() {
        if (slidesData.length === 0) return;
        currentIndex = (currentIndex + 1) % slidesData.length;
        renderSlide(currentIndex);
    }

    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(nextSlide, SLIDE_DURATION);
    }

    fetchSubmissions();
    setInterval(fetchSubmissions, REFRESH_INTERVAL);
</script>

</body>
</html>
