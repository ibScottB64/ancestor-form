<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestor Memory Slideshow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* Image fills 100% of display height and width */
        .full-screen-img {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Forces top/bottom or left/right to hit display edges without distortion */
            display: block;
        }

        /* Overlay text directly on top of the image */
        .text-overlay {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            text-align: center;
            z-index: 3;
            pointer-events: none; /* Allows clicks/touches to pass through */
            padding: 10px;
        }

        .ancestor-name {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: #111111; /* Dark font */
            line-height: 1.1;
            /* White glow and heavy drop shadow for high contrast */
            text-shadow: 
                -2px -2px 0 #ffffff,
                 2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,
                 2px  2px 0 #ffffff,
                0 0 15px rgba(255, 255, 255, 0.9),
                0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .relationship-info {
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            font-weight: 800;
            color: #1a1a1a; /* Dark font */
            margin-top: 6px;
            text-shadow: 
                -1.5px -1.5px 0 #ffffff,
                 1.5px -1.5px 0 #ffffff,
                -1.5px  1.5px 0 #ffffff,
                 1.5px  1.5px 0 #ffffff,
                0 0 12px rgba(255, 255, 255, 0.9),
                0 3px 15px rgba(0, 0, 0, 0.8);
        }

        .relationship-info span {
            color: #004085; /* Dark blue accent for submitter name */
            font-weight: 900;
        }

        /* Loading / Waiting state */
        #status-screen {
            font-size: 1.2rem;
            color: #8b949e;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border-left-color: #58a6ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="slideshow-container" id="slideshowContainer">
    <div id="status-screen">
        <div class="spinner"></div>
        <p id="status-text">Loading ancestor slideshow...</p>
    </div>
</div>

<script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzb3LTmrNDs-snNvwBq2X6IKOZXbFfr6Q9xctObouCubbD8hRnf5NNzWIKVq6JLuqNUFw/exec";

    const SLIDE_DURATION = 6000; // 6 seconds per photo
    const REFRESH_INTERVAL = 30000; // Check Google Sheet for new submissions every 30 seconds

    let slidesData = [];
    let currentIndex = 0;
    let timer = null;

    async function fetchSubmissions() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();

            const validData = data.filter(item => item.imageUrl && item.imageUrl.trim().length > 0);

            if (validData.length === 0) {
                if (slidesData.length === 0) {
                    document.getElementById('status-text').innerText = "No ancestor photos submitted yet.";
                }
                return;
            }

            const isFirstLoad = (slidesData.length === 0);
            slidesData = validData;

            if (isFirstLoad) {
                initSlideshow();
            }
        } catch (error) {
            console.error("Error fetching slideshow data:", error);
            if (slidesData.length === 0) {
                document.getElementById('status-text').innerText = "Unable to load slideshow data.";
            }
        }
    }

    function initSlideshow() {
        const container = document.getElementById('slideshowContainer');
        container.innerHTML = '';

        renderSlide(currentIndex);
        startTimer();
    }

    function renderSlide(index) {
        const container = document.getElementById('slideshowContainer');
        const item = slidesData[index];

        const slideDiv = document.createElement('div');
        slideDiv.className = 'slide active';

        slideDiv.innerHTML = `
            <img class="full-screen-img" src="${item.imageUrl}" alt="${item.ancestorName}">
            <div class="text-overlay">
                <div class="ancestor-name">${item.ancestorName}</div>
                <div class="relationship-info">
                    ${item.relationship} of <span>${item.submitterName}</span>
                </div>
            </div>
        `;

        const oldSlide = container.querySelector('.slide.active');
        container.appendChild(slideDiv);

        if (oldSlide) {
            setTimeout(() => {
                oldSlide.style.opacity = '0';
                setTimeout(() => oldSlide.remove(), 1200);
            }, 50);
        }
    }

    function nextSlide() {
        if (slidesData.length === 0) return;
        currentIndex = (currentIndex + 1) % slidesData.length;
        renderSlide(currentIndex);
    }

    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(nextSlide, SLIDE_DURATION);
    }

    fetchSubmissions();
    setInterval(fetchSubmissions, REFRESH_INTERVAL);
</script>

</body>
</html>
