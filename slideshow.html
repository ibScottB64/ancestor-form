<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestor Memory Slideshow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        .image-wrapper {
            flex: 1;
            max-width: 90vw;
            max-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .caption-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px 35px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 800px;
        }

        .ancestor-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 6px;
        }

        .relationship-info {
            font-size: 1.2rem;
            color: #8b949e;
        }

        .relationship-info span {
            color: #58a6ff;
            font-weight: 600;
        }

        /* Loading / Waiting state */
        #status-screen {
            font-size: 1.5rem;
            color: #8b949e;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #58a6ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="slideshow-container" id="slideshowContainer">
    <div id="status-screen">
        <div class="spinner"></div>
        <p id="status-text">Loading ancestor slideshow...</p>
    </div>
</div>

<script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzb3LTmrNDs-snNvwBq2X6IKOZXbFfr6Q9xctObouCubbD8hRnf5NNzWIKVq6JLuqNUFw/exec";

    const SLIDE_DURATION = 6000; // Time per slide in milliseconds (6 seconds)
    const REFRESH_INTERVAL = 30000; // Check for new submissions every 30 seconds

    let slidesData = [];
    let currentIndex = 0;
    let timer = null;

    async function fetchSubmissions() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();

            // Filter out entries that don't have a valid image URL
            const validData = data.filter(item => item.imageUrl && item.imageUrl.trim().length > 0);

            if (validData.length === 0) {
                if (slidesData.length === 0) {
                    document.getElementById('status-text').innerText = "No ancestor photos submitted yet.";
                }
                return;
            }

            const isFirstLoad = (slidesData.length === 0);
            slidesData = validData;

            if (isFirstLoad) {
                initSlideshow();
            }
        } catch (error) {
            console.error("Error fetching slideshow data:", error);
            if (slidesData.length === 0) {
                document.getElementById('status-text').innerText = "Unable to load slideshow data.";
            }
        }
    }

    function initSlideshow() {
        const container = document.getElementById('slideshowContainer');
        container.innerHTML = ''; // Clear loading screen

        renderSlide(currentIndex);
        startTimer();
    }

    function renderSlide(index) {
        const container = document.getElementById('slideshowContainer');
        const item = slidesData[index];

        const slideDiv = document.createElement('div');
        slideDiv.className = 'slide active';

        slideDiv.innerHTML = `
            <div class="image-wrapper">
                <img src="${item.imageUrl}" alt="${item.ancestorName}">
            </div>
            <div class="caption-card">
                <div class="ancestor-name">${item.ancestorName}</div>
                <div class="relationship-info">
                    ${item.relationship} of <span>${item.submitterName}</span>
                </div>
            </div>
        `;

        // Keep current slide visible, fade in new one
        const oldSlide = container.querySelector('.slide.active');
        container.appendChild(slideDiv);

        if (oldSlide) {
            setTimeout(() => {
                oldSlide.style.opacity = '0';
                setTimeout(() => oldSlide.remove(), 1200);
            }, 50);
        }
    }

    function nextSlide() {
        if (slidesData.length === 0) return;
        currentIndex = (currentIndex + 1) % slidesData.length;
        renderSlide(currentIndex);
    }

    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(nextSlide, SLIDE_DURATION);
    }

    // Initial fetch
    fetchSubmissions();

    // Periodically fetch new submissions in background
    setInterval(fetchSubmissions, REFRESH_INTERVAL);
</script>

</body>
</html>
