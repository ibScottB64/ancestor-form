<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestor Slideshow</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .slide-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 90vh;
            text-align: center;
        }
        img {
            max-height: 60vh;
            max-width: 80vw;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h1 {
            margin: 5px 0;
            font-size: 2.5rem;
            color: #f8fafc;
        }
        p {
            margin: 5px 0;
            font-size: 1.4rem;
            color: #94a3b8;
        }
        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #64748b;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="status" id="status">Loading submissions...</div>

<div class="slide-container" id="slideContainer" style="display:none;">
    <img id="ancestorImage" src="" alt="Ancestor Photo">
    <h1 id="ancestorName"></h1>
    <p id="relationshipText"></p>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBhReZN56zxvbw1PA1s9b7aVrXcrN9zwZzr19FYOvzhap_dK3qkapKk0sZbwwJf4Zn/exec";
    let slides = [];
    let currentIndex = 0;

    function fetchSlides() {
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    slides = data;
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('slideContainer').style.display = 'flex';
                    if (slides.length === 1 || currentIndex >= slides.length) {
                        showSlide();
                    }
                } else {
                    document.getElementById('status').innerText = "Waiting for submissions...";
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('status').innerText = "Error loading submissions. Retrying...";
            });
    }

    function showSlide() {
    if (slides.length === 0) return;
    const slide = slides[currentIndex];

    let imgUrl = slide.imageUrl;
    let fileId = "";

    // Extract the unique Google Drive File ID regardless of URL format
    if (imgUrl.includes('/d/')) {
        let parts = imgUrl.split('/d/');
        if (parts.length > 1) {
            fileId = parts[1].split('/')[0];
        }
    } else if (imgUrl.includes('id=')) {
        let parts = imgUrl.split('id=');
        if (parts.length > 1) {
            fileId = parts[1].split('&')[0];
        }
    }

    // Convert the Drive file ID into a direct public thumbnail/image link
    if (fileId) {
        imgUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
    }

    document.getElementById('ancestorImage').src = imgUrl;
    document.getElementById('ancestorName').innerText = slide.ancestorName;
    document.getElementById('relationshipText').innerText = `Submitted by ${slide.submitterName} (${slide.relationship})`;
}

    function nextSlide() {
        if (slides.length > 0) {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide();
        }
    }

    fetchSlides();
    setInterval(fetchSlides, 30000); // Check for new submissions every 30s
    setInterval(nextSlide, 8000);   // Rotate slides every 8 seconds
</script>

</body>
</html>
